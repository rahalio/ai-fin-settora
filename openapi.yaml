openapi: 3.0.3
info:
  title: Settora
  version: 0.1.0
  description: >-
    Multi-party post-trade agreement fabric with shared deal state, break workflows,
    settlement instructions to incumbent rails, and jurisdictional finality attestations.
  x-product-slug: ai-fin-settora
  x-source: ai-in-financial/WEF_The_future_of_financial_infrastructure/
servers:
  - url: https://api.example.com
tags:
  - name: Participants
    description: Network membership and permissions
  - name: Deals
    description: Shared trade and trade-finance deal state
  - name: Breaks
    description: Break detection and exception workflows
  - name: Settlements
    description: Settlement instructions to incumbent rails
  - name: Finality
    description: Jurisdictional finality attestations
  - name: Collateral
    description: In-flight collateral and margin visibility
  - name: Governance
    description: Rulebook versions and participant suspension
paths:
  /v1/participants:
    get:
      operationId: listParticipants
      tags: [Participants]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Participants page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeParticipant"
    post:
      operationId: registerParticipant
      tags: [Participants]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantCreate"
      responses:
        "201":
          description: Participant registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeParticipant"
  /v1/participants/{participantId}/suspend:
    parameters:
      - $ref: "#/components/parameters/ParticipantId"
    post:
      operationId: suspendParticipant
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "202":
          description: Participant suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeParticipant"
  /v1/deals:
    get:
      operationId: listTradeDeals
      tags: [Deals]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: dealType
          in: query
          schema:
            type: string
            enum: [equityPostTrade, tradeFinance, syndicatedLoan]
      responses:
        "200":
          description: Deals page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTradeDeal"
    post:
      operationId: createTradeDeal
      tags: [Deals]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeDealCreate"
      responses:
        "201":
          description: Deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTradeDeal"
  /v1/deals/{dealId}/assertions:
    parameters:
      - $ref: "#/components/parameters/DealId"
    post:
      operationId: submitStateAssertion
      tags: [Deals]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateAssertion"
      responses:
        "201":
          description: Assertion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStateAssertion"
  /v1/deals/{dealId}/agreed-state:
    parameters:
      - $ref: "#/components/parameters/DealId"
    get:
      operationId: getAgreedState
      tags: [Deals]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Current agreed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAgreedState"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deals/{dealId}/milestones:
    parameters:
      - $ref: "#/components/parameters/DealId"
    post:
      operationId: attestDocumentMilestone
      tags: [Deals]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentMilestone"
      responses:
        "201":
          description: Milestone attested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDocumentMilestone"
  /v1/deals/{dealId}/corporate-actions:
    parameters:
      - $ref: "#/components/parameters/DealId"
    post:
      operationId: recordCorporateActionEvent
      tags: [Deals]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorporateActionEvent"
      responses:
        "201":
          description: Corporate action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCorporateActionEvent"
  /v1/breaks:
    get:
      operationId: listBreakCases
      tags: [Breaks]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved, escalated]
      responses:
        "200":
          description: Breaks page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeBreakCase"
    post:
      operationId: openBreakCase
      tags: [Breaks]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakCaseCreate"
      responses:
        "201":
          description: Break opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBreakCase"
  /v1/breaks/{breakId}/resolve:
    parameters:
      - $ref: "#/components/parameters/BreakId"
    post:
      operationId: resolveBreakCase
      tags: [Breaks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string }
                winningAssertionId: { type: string }
      responses:
        "200":
          description: Break resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBreakCase"
  /v1/settlements/instructions:
    post:
      operationId: createSettlementInstruction
      tags: [Settlements]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementInstructionCreate"
      responses:
        "201":
          description: Instruction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSettlementInstruction"
  /v1/settlements/instructions/{instructionId}:
    parameters:
      - $ref: "#/components/parameters/InstructionId"
    get:
      operationId: getSettlementInstruction
      tags: [Settlements]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Settlement instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSettlementInstruction"
  /v1/finality/attestations:
    get:
      operationId: listFinalityAttestations
      tags: [Finality]
      security:
        - BearerAuth: []
      parameters:
        - name: instructionId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Finality attestations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFinalityAttestation"
    post:
      operationId: recordFinalityAttestation
      tags: [Finality]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalityAttestation"
      responses:
        "201":
          description: Finality recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeFinalityAttestation"
  /v1/collateral/locks:
    get:
      operationId: listCollateralLocks
      tags: [Collateral]
      security:
        - BearerAuth: []
      parameters:
        - name: dealId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Collateral locks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeCollateralLock"
  /v1/provenance/{assetId}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getProvenanceRecord
      tags: [Deals]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Asset provenance chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProvenanceRecord"
  /v1/governance/rulebooks:
    post:
      operationId: publishRulebookVersion
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulebookVersion"
      responses:
        "201":
          description: Rulebook published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRulebookVersion"
  /v1/governance/votes:
    post:
      operationId: recordGovernanceVote
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceVote"
      responses:
        "201":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeGovernanceVote"
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string }
    BreakId:
      name: breakId
      in: path
      required: true
      schema: { type: string }
    InstructionId:
      name: instructionId
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }
  responses:

    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Participant:
      type: object
      required: [id, legalName, role, status, assuranceLevel]
      properties:
        id: { type: string }
        legalName: { type: string }
        role:
          type: string
          enum: [brokerDealer, custodian, agentBank, csd, ccp, tradeFinanceBank, regulator]
        status:
          type: string
          enum: [active, suspended, pending]
        assuranceLevel: { type: string }
    ParticipantCreate:
      type: object
      required: [legalName, role, assuranceLevel]
      properties:
        legalName: { type: string }
        role:
          type: string
          enum: [brokerDealer, custodian, agentBank, csd, ccp, tradeFinanceBank, regulator]
        assuranceLevel: { type: string }
    TradeDeal:
      type: object
      required: [id, dealType, status]
      properties:
        id: { type: string }
        dealType:
          type: string
          enum: [equityPostTrade, tradeFinance, syndicatedLoan]
        status:
          type: string
          enum: [open, matched, settling, settled, failed, disputed]
        participantIds:
          type: array
          items: { type: string }
    TradeDealCreate:
      type: object
      required: [dealType, participantIds]
      properties:
        dealType:
          type: string
          enum: [equityPostTrade, tradeFinance, syndicatedLoan]
        participantIds:
          type: array
          items: { type: string }
        externalRef: { type: string }
    StateAssertion:
      type: object
      required: [id, dealId, participantId, fields, assertedAt]
      properties:
        id: { type: string }
        dealId: { type: string }
        participantId: { type: string }
        fields:
          type: object
          additionalProperties: true
        assertedAt: { type: string, format: date-time }
    AgreedState:
      type: object
      required: [dealId, version, fields, agreedAt]
      properties:
        dealId: { type: string }
        version: { type: integer }
        fields:
          type: object
          additionalProperties: true
        agreedAt: { type: string, format: date-time }
        hash: { type: string }
    BreakCase:
      type: object
      required: [id, dealId, conflictingFields, status, openedAt]
      properties:
        id: { type: string }
        dealId: { type: string }
        conflictingFields:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [open, investigating, resolved, escalated]
        ownerParticipantId: { type: string }
        dueAt: { type: string, format: date-time }
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    BreakCaseCreate:
      type: object
      required: [dealId, conflictingFields]
      properties:
        dealId: { type: string }
        conflictingFields:
          type: array
          items: { type: string }
        assertionIds:
          type: array
          items: { type: string }
    SettlementInstruction:
      type: object
      required: [id, dealId, rail, status]
      properties:
        id: { type: string }
        dealId: { type: string }
        rail:
          type: string
          enum: [csd, ccp, payment]
        status:
          type: string
          enum: [created, sent, acknowledged, failed, cancelled]
        payloadRef: { type: string }
        createdAt: { type: string, format: date-time }
    SettlementInstructionCreate:
      type: object
      required: [dealId, rail]
      properties:
        dealId: { type: string }
        rail:
          type: string
          enum: [csd, ccp, payment]
        payloadRef: { type: string }
    FinalityAttestation:
      type: object
      required: [id, instructionId, status, jurisdiction, recordedAt]
      properties:
        id: { type: string }
        instructionId: { type: string }
        status:
          type: string
          enum: [provisional, final, void]
        jurisdiction: { type: string }
        opinionVersion: { type: string }
        recordedAt: { type: string, format: date-time }
    CollateralLock:
      type: object
      required: [id, dealId, amount, currency, status]
      properties:
        id: { type: string }
        dealId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string }
        status:
          type: string
          enum: [locked, released, partiallyReleased]
        releasedAt: { type: string, format: date-time }
    CorporateActionEvent:
      type: object
      required: [id, dealId, eventType, attestedBy, attestedAt]
      properties:
        id: { type: string }
        dealId: { type: string }
        eventType: { type: string }
        attestedBy: { type: string }
        attestedAt: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: true
    DocumentMilestone:
      type: object
      required: [id, dealId, milestoneType, status, attestedBy]
      properties:
        id: { type: string }
        dealId: { type: string }
        milestoneType:
          type: string
          enum: [presentment, acceptance, discrepancy, paymentObligation]
        status:
          type: string
          enum: [attested, disputed, cleared]
        attestedBy: { type: string }
        attestedAt: { type: string, format: date-time }
    ProvenanceRecord:
      type: object
      required: [assetId, chain]
      properties:
        assetId: { type: string }
        chain:
          type: array
          items:
            type: object
            properties:
              holderId: { type: string }
              event: { type: string }
              at: { type: string, format: date-time }
    SupervisorySubscription:
      type: object
      required: [id, regulatorParticipantId, scope]
      properties:
        id: { type: string }
        regulatorParticipantId: { type: string }
        scope: { type: string }
        active: { type: boolean }
    RulebookVersion:
      type: object
      required: [id, version, effectiveFrom]
      properties:
        id: { type: string }
        version: { type: string }
        effectiveFrom: { type: string, format: date-time }
        summary: { type: string }
    GovernanceVote:
      type: object
      required: [id, proposal, voterParticipantId, vote]
      properties:
        id: { type: string }
        proposal: { type: string }
        voterParticipantId: { type: string }
        vote:
          type: string
          enum: [for, against, abstain]
        votedAt: { type: string, format: date-time }

    DataEnvelopeParticipant:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Participant"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeParticipant:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Participant"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeTradeDeal:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TradeDeal"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeTradeDeal:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TradeDeal"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeStateAssertion:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/StateAssertion"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeStateAssertion:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StateAssertion"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeAgreedState:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AgreedState"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeAgreedState:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AgreedState"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeBreakCase:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/BreakCase"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeBreakCase:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BreakCase"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeSettlementInstruction:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SettlementInstruction"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSettlementInstruction:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SettlementInstruction"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeFinalityAttestation:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/FinalityAttestation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeFinalityAttestation:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FinalityAttestation"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeCollateralLock:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CollateralLock"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeCollateralLock:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CollateralLock"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeDocumentMilestone:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DocumentMilestone"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDocumentMilestone:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DocumentMilestone"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeCorporateActionEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CorporateActionEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeCorporateActionEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CorporateActionEvent"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeProvenanceRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ProvenanceRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeProvenanceRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProvenanceRecord"

openapi: 3.1.0
info:
  title: Settora Participants API
  version: 0.1.0
  description: Network membership, assurance, and need-to-know permissions.
  x-domain: participants
  x-product-slug: settora
  license: { name: Proprietary }
servers:
  - url: https://api.settora.local
security:
  - apiKey: []
tags:
  - name: Participants
    description: Network membership and permissions
paths:
  /v1/participants:
    get:
      operationId: listParticipants
      tags: [Participants]
      summary: List participants
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantStatus }
        - name: role
          in: query
          schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantRole }
      responses:
        '200':
          description: Participants page
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantListResponse }
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerParticipant
      tags: [Participants]
      summary: Admit / register a participant
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantCreateRequest }
      responses:
        '201':
          description: Participant registered
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/participants/{participantId}:
    get:
      operationId: getParticipant
      tags: [Participants]
      summary: Get participant
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantId }
      responses:
        '200':
          description: Participant
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    patch:
      operationId: updateParticipant
      tags: [Participants]
      summary: Update participant permissions / assurance
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantId }
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantUpdateRequest }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: ./participants.schemas.yaml#/components/schemas/ParticipantResponse }
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
